<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise | Analytics</title>

    <style>
        body {
            margin: 0;
            padding: 25px;
            background: #f5f3ff;
            font-family: Arial, sans-serif;
            color: #30205f;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .nav a {
            display: inline-block;
            margin: 8px 12px 8px 0;
            color: #6844c5;
            text-decoration: none;
            font-weight: bold;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px #24134d12;
        }

        .card p { color: #777; }
        .card h2 { color: #6844c5; }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-top: 25px;
        }

        .bar-row {
            margin: 22px 0;
        }

        .bar {
            height: 18px;
            background: #e9e2ff;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 8px;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: #6844c5;
        }

        #expenseBar { background: #e36b83; }

        #message { color: #6844c5; }
    </style>
</head>

<body>
<div class="container">

    <h1>Financial Analytics 📊</h1>
    <p>Understand your financial activity at a glance.</p>

    <div class="nav">
        <a href="/dashboard">Dashboard</a>
        <a href="/budget">Budget</a>
        <a href="/transactions">Transactions</a>
        <a href="/analytics">Analytics</a>
        <a href="/goals">Goals</a>
    </div>

    <div class="cards">

        <div class="card">
            <p>Total Income</p>
            <h2 id="income">₹0</h2>
        </div>

        <div class="card">
            <p>Total Expenses</p>
            <h2 id="expense">₹0</h2>
        </div>

        <div class="card">
            <p>Remaining Balance</p>
            <h2 id="balance">₹0</h2>
        </div>

    </div>

    <div class="chart-card">
        <h2>Income vs Expenses</h2>

        <div class="bar-row">
            <strong>Income</strong>
            <div class="bar">
                <div class="fill" id="incomeBar"></div>
            </div>
            <p id="incomePercent">0%</p>
        </div>

        <div class="bar-row">
            <strong>Expenses</strong>
            <div class="bar">
                <div class="fill" id="expenseBar"></div>
            </div>
            <p id="expensePercent">0%</p>
        </div>

        <p id="message">Loading analytics...</p>
    </div>

</div>

<script>
async function loadAnalytics() {
    try {
        const response = await fetch("/api/summary");

        if (response.status === 401) {
            window.location.href = "/login";
            return;
        }

        if (!response.ok) {
            throw new Error("Unable to load data");
        }

        const data = await response.json();

        const income = Number(data.income);
        const expense = Number(data.expense);
        const balance = Number(data.balance);

        document.getElementById("income").textContent =
            "₹" + income.toFixed(2);

        document.getElementById("expense").textContent =
            "₹" + expense.toFixed(2);

        document.getElementById("balance").textContent =
            "₹" + balance.toFixed(2);

        const total = income + expense;

        const incomePercent = total > 0
            ? (income / total) * 100 : 0;

        const expensePercent = total > 0
            ? (expense / total) * 100 : 0;

        document.getElementById("incomeBar").style.width =
            incomePercent + "%";

        document.getElementById("expenseBar").style.width =
            expensePercent + "%";

        document.getElementById("incomePercent").textContent =
            incomePercent.toFixed(1) + "%";

        document.getElementById("expensePercent").textContent =
            expensePercent.toFixed(1) + "%";

        document.getElementById("message").textContent =
            "Your financial summary is up to date.";

    } catch (error) {
        document.getElementById("message").textContent =
            "Unable to load analytics. Please try again.";
    }
}

loadAnalytics();
</script>

</body>
</html>
